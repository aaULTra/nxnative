# Complete iOS preparation is uploaded and verified before app packaging.
# Future compatible runs restore that boundary; only resource extraction repeats.
# Private Drive files hold binaries; public artifacts remain metadata only.
name: MCD2 verified allocator replacement IPA

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mcd2-complete-preparation
  cancel-in-progress: false

jobs:
  integrated:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/mcd2-allocator-run-pr25' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner }}
    name: Restore or prepare shaders, checkpoint, package and deliver
    runs-on: xcode-27
    timeout-minutes: 330
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BASE_URL: ${{ secrets.MCD2_BASE_URL }}
      UPDATE_URL: ${{ secrets.MCD2_UPDATE_URL }}
      MCD2_GDRIVE_SA_JSON: ${{ secrets.MCD2_GDRIVE_SA_JSON }}
      KEYS_TEXT: ${{ secrets.MCD2_PROD_KEYS }}
      DM_GAME: '0100A7C01B792000'
      MCD2_OUTPUT_FILE: '1s4b_udOW7KN95fF67-wgKyjvTjBZLbHm'
      MCD2_STATUS_FILE: '1lHLo1IrocQAibhELIrnSrYyoTku5uq8W'
      MCD2_READY_INDEX: '10amTRrrjaO0rBe0wH3zsBjWAoKeG66KN'
      MCD2_READY_A: '1h33TNA_6YaUTOkVfY4vOAbpDNmd3afpH'
      MCD2_READY_B: '1_RZFQj6raDMoSACt5XQx7fgsMHH2LZuF'
      MCD2_PROBE_FILE: '1-9w7D8kBDJyVnQmNp5LjD0vC6oHOJjon'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2befb92a41528961230283778c88cf03d1b9171d
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Check toolchain and install only missing build tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          python -m pip install lz4 capstone fonttools google-api-python-client google-auth
          command -v zstd || brew install zstd
          command -v xcodegen || brew install xcodegen
          command -v glslangValidator || brew install glslang
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi
          xcrun --sdk iphoneos --show-sdk-version
          python dm/gfx/tools/own_compilers.py --check-metal
          python3 -m unittest discover -s scripts/tests -p 'test_mcd2_*.py' -q
          df -h "$RUNNER_TEMP"
      - name: Check dedicated Drive output access before downloading games
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/mcd2_drive_output.py --output "$MCD2_OUTPUT_FILE"
          python -u scripts/mcd2_cloud.py --begin --status-only
          python -u scripts/mcd2_storage_probe.py
      - name: Materialize private NSPs in ephemeral disk only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_URL" && test -n "$UPDATE_URL" && test -n "$KEYS_TEXT" || {
            echo "::error::MCD2_BASE_URL, MCD2_UPDATE_URL and MCD2_PROD_KEYS are required"; exit 1;
          }
          test -n "${MCD2_GDRIVE_SA_JSON:-}" || {
            echo "::error::Add GitHub Actions secret MCD2_GDRIVE_SA_JSON before running this build"; exit 1;
          }
          umask 077
          mkdir -p "$RUNNER_TEMP/mcd2/game"
          printf '%s\n' "$KEYS_TEXT" > "$RUNNER_TEMP/mcd2/prod.keys"
          folder="$RUNNER_TEMP/mcd2/game"
          python -u scripts/mcd2_drive_api_download.py "$folder" \
            --base-link "$BASE_URL" --update-link "$UPDATE_URL" \
            --credentials-env MCD2_GDRIVE_SA_JSON
          python scripts/mcd2_preflight.py "$folder" --keys "$RUNNER_TEMP/mcd2/prod.keys"
      - name: Restore a verified complete preparation if compatible
        id: restore
        shell: bash
        run: |
          python -u scripts/mcd2_resumable_build.py restore "$RUNNER_TEMP/mcd2/game" \
            --keys "$RUNNER_TEMP/mcd2/prod.keys"
      - name: Prepare rewritten modules and all iOS shaders
        if: steps.restore.outputs.restored != 'true'
        shell: bash
        run: |
          python -u scripts/mcd2_resumable_build.py prepare "$RUNNER_TEMP/mcd2/game" \
            --keys "$RUNNER_TEMP/mcd2/prod.keys"
      - name: Save and verify the complete preparation BEFORE packaging
        if: steps.restore.outputs.restored != 'true'
        shell: bash
        timeout-minutes: 30
        run: |
          python -u scripts/mcd2_resumable_build.py save "$RUNNER_TEMP/mcd2/game" \
            --keys "$RUNNER_TEMP/mcd2/prod.keys"
      - name: Re-extract game resources using retained code and shaders
        if: steps.restore.outputs.restored == 'true'
        shell: bash
        run: |
          python -u scripts/mcd2_resumable_build.py rehydrate "$RUNNER_TEMP/mcd2/game" \
            --keys "$RUNNER_TEMP/mcd2/prod.keys"
      - name: Compile iOS app and package IPA from verified prepared inputs
        shell: bash
        run: |
          python -u scripts/mcd2_resumable_build.py package "$RUNNER_TEMP/mcd2/game" \
            --keys "$RUNNER_TEMP/mcd2/prod.keys"
      - name: Verify IPA archive and deliver to dedicated Drive output
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          python -u scripts/mcd2_resumable_build.py deliver "$RUNNER_TEMP/mcd2/game" \
            --keys "$RUNNER_TEMP/mcd2/prod.keys"
      - name: Publish final readable status
        if: always()
        shell: bash
        env:
          MCD2_FINAL_STATE: ${{ job.status }}
        run: python -u scripts/mcd2_cloud.py --final-state "$MCD2_FINAL_STATE" --status-only
      - name: Save checkpoint index (metadata only; not reusable guest content)
        if: always()
        shell: bash
        run: |
          src="$RUNNER_TEMP/mcd2/game/mcd2-progress-checkpoints.json"
          if test -s "$src"; then
            cp "$src" "$GITHUB_WORKSPACE/mcd2-progress-checkpoints.json"
          fi
      - name: Upload non-sensitive checkpoint index
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcd2-checkpoint-index
          path: mcd2-progress-checkpoints.json
          if-no-files-found: warn
          retention-days: 2
      - name: Delete private NSPs, keys and all generated game code
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/mcd2"
