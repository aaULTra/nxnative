# Original-Switch game analysis on GitHub's Linux runner.
# Never commit licensed game NSPs, console keys, or decrypted files.
name: MCD2 remote survey

on:
  # One diagnostic rerun on merging changes to this specific survey workflow
  # or scanner. Never runs on an untrusted pull request with secrets.
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcd2-remote-survey.yml'
      - 'scripts/mcd2_deep_diagnostics.py'
  pull_request:
    paths:
      - '.github/workflows/mcd2-remote-survey.yml'
      - 'scripts/mcd2_preflight.py'
      - 'scripts/tests/test_mcd2_preflight.py'
      - 'scripts/tests/test_mcd2_deep_diagnostics.py'
      - 'scripts/tests/test_mcd2_profile.py'
      - 'scripts/mcd2_deep_diagnostics.py'
      - 'dm/games/0100A7C01B792000/**'
  workflow_dispatch:
    inputs:
      run_survey:
        description: 'Analyse game files using your private, expiring HTTPS links and keys'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  linux-toolchain:
    name: Test Linux survey prerequisites (no game files)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install Python analysis and Google Drive download packages
        run: python -m pip install lz4 capstone fonttools gdown
      - name: Verify Google Drive downloader is installed
        run: gdown --help >/dev/null
      - name: Test MCD2 pairing, profile and diagnostic scanners
        run: python -m unittest discover -s scripts/tests -p 'test_mcd2_*.py' -v
      - name: Compile the original Switch NSP manifest extractor on Linux
        run: dotnet build dm/tools/nx_extract -c Release -v quiet --nologo
      - name: Confirm survey script starts on Linux
        run: python scripts/build_ipa_from_nsp.py --help >/dev/null

  private-game-survey:
    # No secrets are exposed to pull requests. Only main-branch pushes that
    # change this diagnostic workflow/scanner, or explicit manual runs, can run.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_survey)) }}
    name: Generate base + v65536 survey
    needs: linux-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_URL: ${{ secrets.MCD2_BASE_URL }}
      UPDATE_URL: ${{ secrets.MCD2_UPDATE_URL }}
      KEYS_TEXT: ${{ secrets.MCD2_PROD_KEYS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install Python packages
        run: python -m pip install lz4 capstone fonttools gdown
      - name: Verify private GitHub Actions secrets exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_URL" || { echo "::error::Set MCD2_BASE_URL as a repository Actions secret"; exit 1; }
          test -n "$UPDATE_URL" || { echo "::error::Set MCD2_UPDATE_URL as a repository Actions secret"; exit 1; }
          test -n "$KEYS_TEXT" || { echo "::error::Set MCD2_PROD_KEYS as a repository Actions secret"; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/mcd2/game"
          printf '%s\n' "$KEYS_TEXT" > "$RUNNER_TEMP/mcd2/prod.keys"
      - name: Download owned base and update NSPs to ephemeral runner storage
        shell: bash
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/mcd2/game"
          # A standard Google Drive sharing link points to an HTML preview.
          # gdown resolves the actual file and the large-file confirmation page.
          # Never print the sharing URLs or log gdown's redirect URLs.
          download_nsp() {
            local url="$1" output="$2" expected_bytes="$3"
            case "$url" in
              https://drive.google.com/*)
                gdown --quiet --continue --retries 3 "$url" -O "$output"
                ;;
              https://*)
                curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error \
                  --output "$output" "$url"
                ;;
              *)
                echo "::error::The NSP link must start with https://" >&2
                return 1
                ;;
            esac
            local actual_size
            actual_size=$(stat -c '%s' "$output")
            if [ "$actual_size" -ne "$expected_bytes" ]; then
              echo "::error::Downloaded file has a different size than the Drive metadata; recheck the NSP and link before extraction." >&2
              return 1
            fi
          }
          download_nsp "$BASE_URL" "$folder/Minecraft Dungeons 2 [0100A7C01B792000][v0].nsp" 1662600274
          download_nsp "$UPDATE_URL" "$folder/Minecraft Dungeons 2 [0100A7C01B792800][v65536].nsp" 2943659595
      - name: Validate pairing and extract only ExeFS + RomFS metadata
        shell: bash
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/mcd2/game"
          base="$folder/Minecraft Dungeons 2 [0100A7C01B792000][v0].nsp"
          update="$folder/Minecraft Dungeons 2 [0100A7C01B792800][v65536].nsp"
          survey="$folder/0100A7C01B792000_survey"
          python scripts/mcd2_preflight.py "$folder" --keys "$RUNNER_TEMP/mcd2/prod.keys"
          # The full survey's instruction census already ran successfully in
          # 40787097883. Repeating 30+ million instructions every time adds
          # minutes without improving this targeted archive/memory diagnostic.
          # nx_extract --manifest writes the merged ExeFS and a text listing
          # of RomFS paths and sizes, without unpacking the 3.87 GiB RomFS.
          dotnet build dm/tools/nx_extract -c Release -v quiet --nologo
          mkdir -p "$survey/extract"
          dotnet run --project dm/tools/nx_extract -c Release --no-build -- \
            "$RUNNER_TEMP/mcd2/prod.keys" "$base" "$update" "$survey/extract" --manifest
          test -s "$survey/extract/ExeFS/main"
          test -s "$survey/extract/romfs_manifest.tsv"
          python scripts/mcd2_deep_diagnostics.py "$survey" --output "$GITHUB_WORKSPACE/mcd2-deep-diagnostics.md"
          test -s "$GITHUB_WORKSPACE/mcd2-deep-diagnostics.md"
      - name: Upload survey text only (public repository artifact, no game files)
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcd2-deep-diagnostics
          path: mcd2-deep-diagnostics.md
          if-no-files-found: error
          retention-days: 1
      - name: Delete the temporary game and keys
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/mcd2"
