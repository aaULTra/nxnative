name: MCD2 package-pairing preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/mcd2_preflight.py'
      - 'scripts/tests/test_mcd2_preflight.py'
      - 'scripts/tests/test_mcd2_build_lookup.py'
      - 'scripts/tests/test_mcd2_profile.py'
      - 'scripts/tests/test_mcd2_integrated.py'
      - 'scripts/tests/test_mcd2_observed.py'
      - 'scripts/mcd2_observed_build.py'
      - 'scripts/mcd2_checkpoint.py'
      - 'scripts/tests/test_mcd2_checkpoint.py'
      - 'scripts/mcd2_drive_api_download.py'
      - 'scripts/mcd2_drive_output.py'
      - 'scripts/tests/test_mcd2_drive_output.py'
      - 'scripts/mcd2_cloud.py'
      - 'scripts/tests/test_mcd2_cloud.py'
      - '.github/workflows/mcd2-backup.yml'
      - 'scripts/tests/test_mcd2_drive_api_download.py'
      - '.github/workflows/mcd2-observed.yml'
      - 'scripts/mcd2_integrated_build.py'
      - '.github/workflows/mcd2-integrated.yml'
      - 'dm/games/0100A7C01B792000/**'
      - 'scripts/build_ipa_from_nsp.py'
      - '.github/workflows/mcd2-preflight.yml'

permissions:
  contents: read

jobs:
  check-package-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Test MCD2 pairing and updated-only survey lookup
        run: python3 -m unittest discover -s scripts/tests -p 'test_mcd2_*.py' -v
