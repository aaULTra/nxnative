# One real-game pipeline: merged NSP extraction, Unreal shader decoding and
# Metal translation, Mac host compilation, startup smoke, unsigned iOS IPA.
# Only a compact text status is uploaded; never game binaries, keys or IPA.
name: MCD2 integrated bring-up

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcd2-integrated.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcd2-integrated
  cancel-in-progress: false

jobs:
  integrated:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    name: Real game shaders, Mac boot and IPA attempt
    runs-on: xcode-27
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BASE_URL: ${{ secrets.MCD2_BASE_URL }}
      UPDATE_URL: ${{ secrets.MCD2_UPDATE_URL }}
      KEYS_TEXT: ${{ secrets.MCD2_PROD_KEYS }}
      DM_GAME: '0100A7C01B792000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Check toolchain and install only missing build tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          python -m pip install lz4 capstone fonttools gdown
          command -v zstd || brew install zstd
          command -v xcodegen || brew install xcodegen
          command -v glslangValidator || brew install glslang
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi
          xcrun --sdk iphoneos --show-sdk-version
          python dm/gfx/tools/own_compilers.py --check-metal
          python3 -m unittest discover -s scripts/tests -p 'test_mcd2_*.py' -q
          df -h "$RUNNER_TEMP"
      - name: Materialize private NSPs in ephemeral disk only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_URL" && test -n "$UPDATE_URL" && test -n "$KEYS_TEXT" || {
            echo "::error::MCD2_BASE_URL, MCD2_UPDATE_URL and MCD2_PROD_KEYS are required"; exit 1;
          }
          umask 077
          mkdir -p "$RUNNER_TEMP/mcd2/game"
          printf '%s\n' "$KEYS_TEXT" > "$RUNNER_TEMP/mcd2/prod.keys"
          download_nsp() {
            local url="$1" out="$2" bytes="$3"
            case "$url" in
              https://drive.google.com/*) gdown --quiet --continue --retries 3 "$url" -O "$out";;
              https://*) curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error -o "$out" "$url";;
              *) echo "::error::Invalid download URL scheme"; return 1;;
            esac
            test "$(stat -f '%z' "$out")" = "$bytes" || {
              echo "::error::Downloaded NSP differs from expected verified size"; return 1;
            }
          }
          folder="$RUNNER_TEMP/mcd2/game"
          download_nsp "$BASE_URL" "$folder/Minecraft Dungeons 2 [0100A7C01B792000][v0].nsp" 1662600274
          download_nsp "$UPDATE_URL" "$folder/Minecraft Dungeons 2 [0100A7C01B792800][v65536].nsp" 2943659595
          python scripts/mcd2_preflight.py "$folder" --keys "$RUNNER_TEMP/mcd2/prod.keys"
      - name: Attempt Unreal shaders, Mac host boot and unsigned iOS package
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/mcd2_integrated_build.py "$RUNNER_TEMP/mcd2/game" \
            --keys "$RUNNER_TEMP/mcd2/prod.keys" \
            --report "$GITHUB_WORKSPACE/mcd2-integrated-report.md"
      - name: Upload text-only integrated result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcd2-integrated-report
          path: mcd2-integrated-report.md
          if-no-files-found: warn
          retention-days: 2
      - name: Delete private NSPs, keys and all generated game code
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/mcd2"
